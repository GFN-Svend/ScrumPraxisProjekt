<header class="site-header">
  <div class="header-inner">
    <h1 class="site-title">Willkommen im Bürgerportal</h1>
    <nav class="site-navigation" aria-label="Hauptnavigation">
      <ul>
        <li><a href="{{ url_for('main.index') }}#home">Home</a></li>

        <li>
          <a
            href="{{ url_for('main.aktuelles') }}"
            class="nav-link {% if request.endpoint == 'main.aktuelles' %}active{% endif %}"
          >
            Aktuelles
          </a>
        </li>
        <li>
          <a
            href="{{ url_for('main.index', _anchor='support') }}"
            class="nav-link"
          >
            Anliegen melden
          </a>
        </li>
        <li>
          <a
            href="{{ url_for('main.index', _anchor='kontakt') }}"
            class="nav-link"
          >
            Kontakt
          </a>
        </li>
        <li>
          <a
            href="{{ url_for('main.index', _anchor='anfahrt') }}"
            class="nav-link"
          >
            Öffnungszeiten & Anfahrt
          </a>
        </li>
      </ul>
      <form
        action="{{ url_for('main.index') }}"
        method="GET"
        class="search-form"
        role="search"
      >
        <input
          type="search"
          name="q"
          placeholder="Suchen..."
          aria-label="Portal durchsuchen"
          class="search-input"
        />
        <button type="submit" class="search-btn" title="Suchen">🔍</button>
      </form>
    </nav>
  </div>
</header>
