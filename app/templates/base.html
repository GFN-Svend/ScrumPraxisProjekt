<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Bürgerportal{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    {% include "components/navbar.html" %}

    <main class="page {% block page_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}

    <script src="{{ url_for('static', filename='footer_easter_egg.js') }}" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const searchForm = document.querySelector(".search-form");
        const searchInput = document.querySelector(".search-input");

        const sectionMap = {
          kontakt: "kontakt",
          anliegen: "support",
          support: "support",
          öffnungzeiten: "anfahrt",
          anfahrt: "anfahrt",
          home: "home",
        };

        function checkAndScroll(query) {
          const cleanedQuery = query.trim().toLowerCase();
          const targetId = sectionMap[cleanedQuery];
          if (targetId) {
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
              targetElement.scrollIntoView({ behavior: "smooth" });
              return true;
            }
          }
          return false;
        }

        if (searchForm && searchInput) {
          searchForm.addEventListener("submit", (e) => {
            const query = searchInput.value;
            if (checkAndScroll(query)) {
              e.preventDefault();
            }
          });
        }
      });
    </script>
  </body>
</html>
